# ===========================================================================
#  Docker-режим: весь стек одной командой.
#
#      cp .env.example .env        # задайте POSTGRES_ADMIN_PASSWORD
#      docker compose up -d --build
#
#  Интерфейс — http://<адрес машины>:8000, Grafana — http://<адрес машины>:3000.
#  База настраивается сама (PLC_DB_AUTO_SETUP), мастер в браузере не нужен.
# ===========================================================================
name: plc2grafana

services:
  # ---------------------------------------------------------------------
  #  Хранилище временных рядов
  # ---------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: plc-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?задайте POSTGRES_ADMIN_PASSWORD в .env}
      TIMESCALEDB_TELEMETRY: "off"
    # Наружу БД видна только с самой машины (для psql и бэкапов). 5433, а не
    # 5432, — чтобы не столкнуться с PostgreSQL, уже установленным на хосте.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 256mb

  # ---------------------------------------------------------------------
  #  Веб-приложение: интерфейс, опрос устройств, генерация дашбордов
  # ---------------------------------------------------------------------
  app:
    build: .
    container_name: plc-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PLC_WEB_HOST: 0.0.0.0
      PLC_DB_HOST: timescaledb
      PLC_DB_PORT: 5432
      PLC_DB_NAME: ${PLC_DB_NAME:-plc}
      PLC_DB_ADMIN_USER: postgres
      PLC_DB_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      # Создать базу, роли и схему при первом старте, без мастера в браузере
      PLC_DB_AUTO_SETUP: "1"
      # Адрес Grafana для запросов самого приложения (внутри docker-сети).
      # Браузер подставит свой: адрес машины + GRAFANA_HOST_PORT.
      PLC_GRAFANA_URL: http://grafana:3000
      PLC_GRAFANA_PORT: ${GRAFANA_HOST_PORT:-3000}
      PLC_GRAFANA_PUBLIC_URL: ${PLC_GRAFANA_PUBLIC_URL:-}
    volumes:
      - app-config:/app/config
      - app-runtime:/app/runtime
    ports:
      - "${PLC_WEB_PORT:-8000}:8000"
    # Чтобы из контейнера был виден эмулятор (или шлюз), запущенный на хосте:
    # адрес устройства в мастере — host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Для Modbus RTU (RS-485) пробросьте последовательный порт:
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"

  # ---------------------------------------------------------------------
  #  Визуализация
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.0
    container_name: plc-grafana
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Дашборды открываются внутри интерфейса приложения без второго логина
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LIVE_ALLOWED_ORIGINS: "*"
      # Датасорс и дашборды генерирует приложение — берём их из общего тома.
      # Путь тот же, что у приложения: в файле провайдера он записан абсолютным.
      GF_PATHS_PROVISIONING: /app/runtime/grafana-provisioning
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - app-runtime:/app/runtime:ro

volumes:
  timescale-data:
  grafana-data:
  app-config:
  app-runtime:
