# ===========================================================================
#  Docker-режим. Нужен, только если вы хотите запускать всё в контейнерах.
#  Основной способ запуска — локальный: python run.py
#
#      docker compose up -d --build
#      docker compose --profile grafana up -d      # + Grafana контейнером
#
#  В docker-режиме приложение не скачивает Grafana само: она поднимается
#  соседним контейнером, а provisioning берётся из тома runtime/.
# ===========================================================================
name: plc2grafana

services:
  # ---------------------------------------------------------------------
  #  Хранилище временных рядов
  # ---------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: plc-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?задайте POSTGRES_ADMIN_PASSWORD в .env}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb

  # ---------------------------------------------------------------------
  #  Веб-приложение: интерфейс, опрос устройств, генерация дашбордов
  # ---------------------------------------------------------------------
  app:
    build: .
    container_name: plc-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PLC_DB_HOST: timescaledb
      PLC_DB_PORT: 5432
      PLC_DB_NAME: ${PLC_DB_NAME:-plc}
      PLC_DB_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      PLC_DB_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      PLC_WEB_PORT: 8000
      # В контейнере Grafana поднимается отдельным сервисом
      PLC_GRAFANA_URL: ${PLC_GRAFANA_URL:-http://grafana:3000}
    volumes:
      - ./config:/app/config
      - app-runtime:/app/runtime
    ports:
      - "${PLC_WEB_PORT:-8000}:8000"
    # Если контроллер в промышленной подсети и NAT мешает — включите
    # network_mode: host и уберите блок ports выше.
    #
    # Для Modbus RTU (RS-485) пробросьте последовательный порт:
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"

  # ---------------------------------------------------------------------
  #  Визуализация (профиль grafana — поднимается по запросу)
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.0
    container_name: plc-grafana
    restart: unless-stopped
    profiles: ["grafana"]
    depends_on:
      - app
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PROVISIONING: /runtime/grafana-provisioning
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Датасорс и дашборды генерирует приложение — берём их из общего тома
      - app-runtime:/runtime:ro

volumes:
  timescale-data:
  grafana-data:
  app-runtime:
