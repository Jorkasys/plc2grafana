# Сквозная проверка установки так, как её делает пользователь:
#   linux  — скрипт deploy/install_linux.sh на чистой Ubuntu (служба systemd,
#            системный PostgreSQL, встроенная Grafana);
#   docker — docker compose up (TimescaleDB, приложение, Grafana контейнером).
# В обоих случаях tools/e2e_check.py проходит путь от опроса эмулятора ПЛК
# до SQL-запроса через датасорс Grafana.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Эмулятор ПЛК
        run: |
          nohup python3 tools/simulator.py --port 5020 --quiet > /tmp/sim.log 2>&1 &
          sleep 2

      - name: Установка скриптом
        run: sudo bash deploy/install_linux.sh --source .

      - name: Сквозная проверка
        run: python3 tools/e2e_check.py --app http://127.0.0.1:8000 --plc-host 127.0.0.1

      - name: Перезапуск службы — всё поднимается само
        run: |
          sudo systemctl restart plc2grafana
          python3 tools/e2e_check.py --app http://127.0.0.1:8000 --plc-host 127.0.0.1 --cleanup

      - name: Журнал службы
        if: failure()
        run: sudo journalctl -u plc2grafana --no-pager -n 300

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Эмулятор ПЛК на хосте
        run: |
          nohup python3 tools/simulator.py --port 5020 --quiet > /tmp/sim.log 2>&1 &
          sleep 2

      - name: docker compose up
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_ADMIN_PASSWORD=.*/POSTGRES_ADMIN_PASSWORD=e2e-secret-42/' .env
          docker compose up -d --build --wait

      - name: Сквозная проверка
        run: >
          python3 tools/e2e_check.py --app http://127.0.0.1:8000
          --grafana-url http://127.0.0.1:3000
          --plc-host host.docker.internal --external-grafana --cleanup

      - name: Журналы контейнеров
        if: failure()
        run: docker compose logs --no-color --tail 300
