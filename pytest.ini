; Конфигурация тестов для всего репозитория.
;
; Нужна здесь, а не только в poller/pyproject.toml: когда pytest запускают из
; корня, он ищет конфиг по аргументам и может выбрать конфиг подпроекта —
; тогда режим asyncio зависит от порядка аргументов. С этим файлом корень
; всегда rootdir, а асинхронные тесты ведут себя одинаково везде.

[pytest]
testpaths = tests poller/tests
asyncio_mode = auto
