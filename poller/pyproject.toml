[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-logger"
version = "1.0.0"
description = "Опрос Modbus-устройств (Siemens и др.) с записью в TimescaleDB для Grafana"
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.6,<4.0",
    "asyncpg>=0.29,<0.31",
    "PyYAML>=6.0,<7.0",
    "aiohttp>=3.9,<4.0",
]

[project.optional-dependencies]
rtu = ["pyserial>=3.5", "pyserial-asyncio>=0.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
modbus-logger = "modbus_logger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
