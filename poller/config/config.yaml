# ===========================================================================
#  Общие настройки сервиса опроса
#  Любое значение вида ${VAR:default} подставляется из переменных окружения.
# ===========================================================================

logging:
  level: ${LOG_LEVEL:INFO}
  # json — удобно для Loki/ELK; text — удобно читать глазами
  format: text

http:
  # Эндпоинты /healthz, /readyz, /metrics (Prometheus-формат)
  enabled: true
  host: 0.0.0.0
  port: ${POLLER_HTTP_PORT:8080}

database:
  host: ${DB_HOST:127.0.0.1}
  port: ${DB_PORT:5432}
  name: ${POSTGRES_DB:plc}
  user: ${POSTGRES_USER:plc}
  password: ${POSTGRES_PASSWORD:plc}
  # Пул соединений
  min_pool_size: 1
  max_pool_size: 4
  # Буфер записи: пишем пачкой либо по достижении размера, либо по таймауту
  batch_max_rows: 500
  batch_max_delay_ms: 1000
  # Максимум строк в памяти, если БД недоступна. При переполнении
  # выбрасываются самые старые значения (кольцевой буфер).
  buffer_max_rows: 200000

# ---------------------------------------------------------------------------
#  Устройства. Список — можно опрашивать несколько контроллеров сразу.
#  name должно быть уникальным: оно попадает в БД как tag.device.
# ---------------------------------------------------------------------------
devices:
  - name: plc-01
    enabled: true
    description: "Siemens S7-1200, линия розлива"

    transport: tcp
    host: ${PLC_HOST:127.0.0.1}   # по умолчанию — эмулятор tools/simulator.py
    port: ${PLC_PORT:5020}

    # Modbus unit / slave id. У S7 с блоком MB_SERVER обычно игнорируется,
    # но большинство шлюзов требует корректного значения.
    unit_id: ${PLC_UNIT_ID:1}

    # --- Тайминги ---
    timeout_s: 3.0            # таймаут одного запроса
    retries: 2                # повторов запроса до пометки тега как BAD
    reconnect_delay_s: 2.0    # пауза перед переподключением
    reconnect_delay_max_s: 30.0  # верхняя граница экспоненциального backoff
    # Пауза между отдельными Modbus-запросами. Слабым шлюзам/S7 без неё
    # бывает плохо — начните с 20-50 мс, если видите таймауты.
    inter_request_delay_ms: 0

    # --- Группировка регистров в блоки чтения ---
    # Соседние теги объединяются в один запрос, если между ними
    # "дырка" не больше max_gap регистров.
    block:
      max_registers: 100      # <=125 для FC3/FC4, <=2000 бит для FC1/FC2
      max_gap: 8

    # --- Значения по умолчанию для тегов этого устройства ---
    defaults:
      poll_interval_ms: 1000
      word_order: big         # big = ABCD (Siemens/Motorola), little = CDAB
      byte_order: big         # big = обычный, little = байтовый своп (BADC/DCBA)
      deadband: 0.0           # 0 = писать каждое чтение
      deadband_mode: absolute # absolute | percent
      # "Сердцебиение": даже если значение не изменилось, писать не реже,
      # чем раз в N секунд. 0 = отключено.
      heartbeat_s: 60

    # Файл с картой тегов этого устройства
    tags_file: tags.yaml
